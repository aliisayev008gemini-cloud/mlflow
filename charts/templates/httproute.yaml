{{- if .Values.gateway.enabled -}}
apiVersion: {{ if .Capabilities.APIVersions.Has "gateway.networking.k8s.io/v1" }}gateway.networking.k8s.io/v1{{ else }}gateway.networking.k8s.io/v1beta1{{ end }}
kind: HTTPRoute
metadata:
  name: {{ include "mlflow.fullname" . }}
  labels:
    {{- include "mlflow.labels" . | nindent 4 }}
    {{- with .Values.gateway.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- required "gateway.parentRefs must be provided if gateway is enabled" .Values.gateway.parentRefs | toYaml | nindent 4 }}
  {{- if .Values.gateway.hostnames }}
  hostnames:
    {{- toYaml .Values.gateway.hostnames | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "mlflow.fullname" . }}
          port: {{ .Values.server.value_options.port }}
{{- end }}
